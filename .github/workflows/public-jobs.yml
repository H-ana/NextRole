name: Refresh public company jobs
on:
  workflow_dispatch:
  push:
    paths: ['nextrole/public_feed/**', '.github/workflows/public-jobs.yml']
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: write
concurrency:
  group: public-jobs
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public listings without credentials
        run: python nextrole/public_feed/collect.py --previous nextrole/dist/public-jobs.json --output nextrole/dist/public-jobs.json --max-sources 36
      - name: Publish only public listing data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- nextrole/dist/public-jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public company job feed [skip ci]'
            git push origin HEAD:main
          fi
